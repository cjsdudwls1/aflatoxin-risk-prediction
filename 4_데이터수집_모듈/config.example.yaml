# =====================================================================
# 아플라톡신 데이터 수집 모듈 - 설정파일 예시
# 사용법: 이 파일을 config.yaml 로 복사한 뒤 키를 채우세요.
#   copy config.example.yaml config.yaml   (Windows)
# =====================================================================

api_keys:
  # 일별기상 · 토양 호출용 공공데이터포털 서비스키 (data.go.kr 발급)
  agriweather: "여기에_본인_서비스키"

  # 관측소 목록 호출용 서비스키 (위 키로 403 이면 별도 키 필요)
  station: "여기에_관측소_서비스키"

  # (선택) 카카오 로컬 REST API 키 - 주소→좌표 지오코딩에만 사용. 좌표 직접제공시 빈 값 유지.
  kakao_rest: ""

defaults:
  window_size: 60     # 60일 결합 윈도우 길이(가변). combine/pipeline 의 --window 기본값.
  n_neighbors: 20     # cKDTree 최근접 관측소 후보 수. --k 기본값.
  output_dir: "outputs"
  verify_ssl: true    # SSL 인증서 검증(기본 true). 폐쇄망에서만 false 로.
